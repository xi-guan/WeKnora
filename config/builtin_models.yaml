# local omlx (OpenAI-compatible) models.
# base_url and api_key come from .env: OMLX_BASE_URL and OMLX_API_KEY.
# ${VAR} takes no default here, so an unset OMLX_BASE_URL breaks every entry below.
# pointing it at the docker host needs SSRF_WHITELIST=host.docker.internal in .env.

builtin_models:
  - id: builtin-omlx-chat
    name: Qwen3.6-35B-A3B-oQ4e-mtp
    type: KnowledgeQA
    source: remote
    is_default: true
    description: local omlx chat model (MoE, 262k ctx)
    parameters:
      base_url: ${OMLX_BASE_URL}
      api_key: ${OMLX_API_KEY}
      provider: openai
      supports_vision: true
      # measured here: 4 sustains ~151 tok/s, 6 costs 28% latency for 17% throughput
      # the vlm entry shares this server and the cap is per model id, so 3 + 1 = 4
      max_concurrency: 3

  - id: builtin-omlx-chat-27b
    name: Qwen3.8-27B-oQ4e-mtp
    type: KnowledgeQA
    source: remote
    description: local omlx chat model (27B, 262k ctx)
    parameters:
      base_url: ${OMLX_BASE_URL}
      api_key: ${OMLX_API_KEY}
      provider: openai
      supports_vision: true
      max_concurrency: 2

  # same weights as builtin-omlx-chat, registered under VLLM so a knowledge base has a vlm to pick
  # captioning still has to be switched on per knowledge base; registering alone does nothing
  - id: builtin-omlx-vlm
    name: Qwen3.6-35B-A3B-oQ4e-mtp
    type: VLLM
    source: remote
    is_default: true
    description: local omlx vision model (MoE, 262k ctx)
    parameters:
      base_url: ${OMLX_BASE_URL}
      api_key: ${OMLX_API_KEY}
      provider: openai
      supports_vision: true
      max_concurrency: 1

  - id: builtin-omlx-embedding
    name: bge-m3-mlx-8bit
    type: Embedding
    source: remote
    is_default: true
    description: local omlx embedding (1024-dim, 8k ctx)
    parameters:
      base_url: ${OMLX_BASE_URL}
      api_key: ${OMLX_API_KEY}
      provider: openai
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 0

  - id: builtin-omlx-rerank
    name: Qwen3-Reranker-0.6B-4bit
    type: Rerank
    source: remote
    description: local omlx reranker via POST {base_url}/rerank
    parameters:
      base_url: ${OMLX_BASE_URL}
      api_key: ${OMLX_API_KEY}
      provider: generic
